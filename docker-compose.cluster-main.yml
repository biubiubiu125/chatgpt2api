services:
  postgres:
    image: postgres:17-alpine
    container_name: chatgpt2api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatgpt2api_runtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: chatgpt2api_app
      CHATGPT2API_IMAGE_QUEUE_DB: chatgpt2api_image_queue
      CHATGPT2API_POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-chatgpt2api_admin}
      CHATGPT2API_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
    ports:
      - "${WIREGUARD_SERVER_IP:?WIREGUARD_SERVER_IP must be set to an address configured on the main WireGuard interface}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d chatgpt2api_app"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/biubiubiu125/chatgpt2api:latest}
    container_name: chatgpt2api-main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - ./data:/app/data
    environment:
      CHATGPT2API_CONFIG_FILE: /app/data/config.json
      CHATGPT2API_NODE_ROLE: api-main
      CHATGPT2API_RUN_API: "true"
      CHATGPT2API_RUN_WORKER: "false"
      CHATGPT2API_CLUSTER_ID: ${CHATGPT2API_CLUSTER_ID:?CHATGPT2API_CLUSTER_ID is required}
      STORAGE_BACKEND: postgres
      APP_DATABASE_URL: "postgresql+psycopg2://chatgpt2api_runtime:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required; URL-encode POSTGRES_PASSWORD for database URLs}@postgres:5432/chatgpt2api_app"
      DATABASE_URL: "postgresql+psycopg2://chatgpt2api_runtime:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required; URL-encode POSTGRES_PASSWORD for database URLs}@postgres:5432/chatgpt2api_app"
      IMAGE_QUEUE_DATABASE_URL: "postgresql+psycopg2://chatgpt2api_runtime:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required; URL-encode POSTGRES_PASSWORD for database URLs}@postgres:5432/chatgpt2api_image_queue"
      IMAGE_QUEUE_ARTIFACT_ROOT: /app/data/images
      IMAGE_PROMPT_SUFFIX_ENABLED: ${IMAGE_PROMPT_SUFFIX_ENABLED:-true}
      IMAGE_PROMPT_SUFFIX: ${IMAGE_PROMPT_SUFFIX:-}
      IMAGE_QUEUE_RECOVERY_ACCOUNT_TIMEOUT_SECONDS: ${IMAGE_QUEUE_RECOVERY_ACCOUNT_TIMEOUT_SECONDS:-900}
      IMAGE_QUEUE_DELIVERY_GRACE_SECONDS: ${IMAGE_QUEUE_DELIVERY_GRACE_SECONDS:-604800}
      IMAGE_QUEUE_TERMINAL_RETENTION_SECONDS: ${IMAGE_QUEUE_TERMINAL_RETENTION_SECONDS:-2592000}
      IMAGE_QUEUE_STARTUP_RETRY_SECONDS: ${IMAGE_QUEUE_STARTUP_RETRY_SECONDS:-5}
      IMAGE_QUEUE_PROTOCOL_WAIT_TIMEOUT_SECONDS: ${IMAGE_QUEUE_PROTOCOL_WAIT_TIMEOUT_SECONDS:-300}
      IMAGE_QUEUE_VERIFY_RETURNED_URL: ${IMAGE_QUEUE_VERIFY_RETURNED_URL:-true}
      IMAGE_QUEUE_RETURNED_URL_VERIFY_TIMEOUT_SECONDS: ${IMAGE_QUEUE_RETURNED_URL_VERIFY_TIMEOUT_SECONDS:-5}
      IMAGE_QUEUE_RETURNED_URL_VERIFY_ATTEMPTS: ${IMAGE_QUEUE_RETURNED_URL_VERIFY_ATTEMPTS:-3}
      IMAGE_QUEUE_RETURNED_URL_VERIFY_MAX_BYTES: ${IMAGE_QUEUE_RETURNED_URL_VERIFY_MAX_BYTES:-65536}
      IMAGE_QUEUE_GENERATION_CONCURRENCY: ${IMAGE_QUEUE_GENERATION_CONCURRENCY:-}
      IMAGE_QUEUE_GENERATION_CONCURRENCY_CAP: ${IMAGE_QUEUE_GENERATION_CONCURRENCY_CAP:-64}
      IMAGE_QUEUE_ABSOLUTE_GUARD: ${IMAGE_QUEUE_ABSOLUTE_GUARD:-128}
      IMAGE_QUEUE_MAX_BACKLOG: ${IMAGE_QUEUE_MAX_BACKLOG:-50}
      IMAGE_QUEUE_PENDING_TTL_SECONDS: ${IMAGE_QUEUE_PENDING_TTL_SECONDS:-1800}
      IMAGE_QUEUE_CLAIM_MAX_RUNTIME_SECONDS: ${IMAGE_QUEUE_CLAIM_MAX_RUNTIME_SECONDS:-1800}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/health?format=json&scope=runtime', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 30s
