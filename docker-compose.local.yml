services:
  postgres:
    image: postgres:17-alpine
    container_name: chatgpt2api-postgres-local
    environment:
      POSTGRES_DB: chatgpt2api_image_queue
      POSTGRES_USER: chatgpt2api
      POSTGRES_PASSWORD: chatgpt2api
    volumes:
      - chatgpt2api-postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-init:
    image: postgres:17-alpine
    container_name: chatgpt2api-postgres-local-init
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: chatgpt2api
      PGPASSWORD: chatgpt2api
      PGDATABASE: postgres
      TARGET_DB: chatgpt2api_image_queue
    entrypoint:
      - sh
      - -ec
      - |
        if psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${TARGET_DB}'" | grep -qx 1; then
          :
        else
          createdb "${TARGET_DB}"
        fi
        psql -v ON_ERROR_STOP=1 -d "${TARGET_DB}" <<'SQL'
        CREATE TABLE IF NOT EXISTS chatgpt2api_database_role (
          id text PRIMARY KEY,
          role text NOT NULL,
          created_at timestamptz NOT NULL DEFAULT now(),
          updated_at timestamptz NOT NULL DEFAULT now()
        );
        INSERT INTO chatgpt2api_database_role(id, role)
          VALUES ('default', 'image_queue')
          ON CONFLICT (id) DO UPDATE
            SET role = EXCLUDED.role,
                updated_at = now()
            WHERE chatgpt2api_database_role.role = 'image_queue';
        DO $$
        DECLARE actual_role text;
        BEGIN
          SELECT role INTO actual_role FROM chatgpt2api_database_role WHERE id = 'default';
          IF actual_role <> 'image_queue' THEN
            RAISE EXCEPTION 'database role mismatch for %: expected image_queue, got %', current_database(), actual_role;
          END IF;
        END $$;
        SQL

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./data:/app/data
    environment:
      CHATGPT2API_CONFIG_FILE: /app/data/config.json
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      IMAGE_QUEUE_DATABASE_URL: postgresql+psycopg2://chatgpt2api:chatgpt2api@postgres:5432/chatgpt2api_image_queue
      IMAGE_QUEUE_ARTIFACT_ROOT: /app/data/images
      IMAGE_QUEUE_GENERATION_CONCURRENCY: ${IMAGE_QUEUE_GENERATION_CONCURRENCY:-}
      IMAGE_QUEUE_GENERATION_CONCURRENCY_CAP: ${IMAGE_QUEUE_GENERATION_CONCURRENCY_CAP:-64}
      IMAGE_QUEUE_ABSOLUTE_GUARD: ${IMAGE_QUEUE_ABSOLUTE_GUARD:-128}
      IMAGE_QUEUE_MAX_BACKLOG: ${IMAGE_QUEUE_MAX_BACKLOG:-50}
      IMAGE_QUEUE_PENDING_TTL_SECONDS: ${IMAGE_QUEUE_PENDING_TTL_SECONDS:-1800}
      IMAGE_QUEUE_CLAIM_MAX_RUNTIME_SECONDS: ${IMAGE_QUEUE_CLAIM_MAX_RUNTIME_SECONDS:-1800}
      IMAGE_PROMPT_SUFFIX_ENABLED: ${IMAGE_PROMPT_SUFFIX_ENABLED:-true}
      IMAGE_PROMPT_SUFFIX: ${IMAGE_PROMPT_SUFFIX:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/health?format=json&scope=runtime', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 30s
    # 存储后端配置 (可选值: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname
    #   DATABASE_URL: sqlite:////app/data/accounts.db

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
    #   GIT_REPO_URL: https://github.com/user/repo.git
    #   GIT_TOKEN: ghp_xxxxxxxxxxxx
    #   GIT_BRANCH: main
    #   GIT_FILE_PATH: accounts.json
    #   GIT_AUTH_KEYS_FILE_PATH: auth_keys.json

    # 认证密钥 (可选，覆盖 config.json)
    #   CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY}

    # 基础 URL (可选)
    #   CHATGPT2API_BASE_URL: https://your-domain.com

volumes:
  chatgpt2api-postgres-local-data:
