services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatgpt2api_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatgpt2api_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
